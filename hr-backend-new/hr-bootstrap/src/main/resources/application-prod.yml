spring:
  datasource:
    url: ${DATABASE_URL:}
    username: ${DATABASE_USER:}
    password: ${DATABASE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
    baseline-on-migrate: true

logging:
  level:
    com.hr: INFO

app:
  security:
    allowed-origins: ${APP_ALLOWED_ORIGINS:}
    cookie-secure: ${APP_COOKIE_SECURE:true}
    hsts-enabled: ${APP_HSTS_ENABLED:true}
    expose-token: false
