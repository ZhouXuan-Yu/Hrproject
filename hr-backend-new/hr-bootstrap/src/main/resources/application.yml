server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: hr-backend
  profiles:
    active: dev
  datasource:
    url: ${DATABASE_URL:jdbc:mysql://rm-8vb7m858r8wt3b10hjo.mysql.zhangbei.rds.aliyuncs.com:3306/hr_recruitment_db?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${DATABASE_USER:hr_recruitment}
    password: ${DATABASE_PASSWORD:hr_recruitment_123}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3000ms
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

mybatis: # placeholder
  configuration:
    map-underscore-to-camel-case: true

jwt:
  secret: ${JWT_SECRET_KEY:dev-jwt-secret-b4e8f1a3d6c9-change-in-production}
  expires-seconds: ${JWT_ACCESS_TOKEN_EXPIRES:86400}
  remember-me-seconds: 2592000

password:
  salt: ${PASSWORD_SALT:default-salt-change-me}

# DeepSeek AI 配置（后端转发到 Python AI 服务时用）
deepseek:
  api-key: ${DEEPSEEK_API_KEY:}
  base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
  model: ${DEEPSEEK_MODEL:deepseek-chat}

# Python AI 服务地址
ai-service:
  url: ${AI_SERVICE_URL:http://127.0.0.1:8100}
  internal-token: ${AI_INTERNAL_TOKEN:}

# 飞书集成（会议预约、通知）
feishu:
  app-id: ${FEISHU_APP_ID:}
  app-secret: ${FEISHU_APP_SECRET:}
  mock-mode: ${FEISHU_MOCK_MODE:false}
  recipient-open-ids: ${FEISHU_RECIPIENT_OPEN_IDS:{}}

# 候选人确认页
app:
  base-url: ${APP_BASE_URL:http://127.0.0.1:8080}
  security:
    allowed-origins: ${APP_ALLOWED_ORIGINS:http://localhost:7100,http://127.0.0.1:7100}
    cookie-secure: ${APP_COOKIE_SECURE:false}
    hsts-enabled: ${APP_HSTS_ENABLED:false}
    expose-token: ${APP_EXPOSE_TOKEN:false}
company:
  name: ${COMPANY_NAME:}
offer:
  confirm-deadline-days: ${OFFER_CONFIRM_DEADLINE_DAYS:3}
  reminder-interval-hours: ${OFFER_REMINDER_INTERVAL_HOURS:24}

logging:
  level:
    com.hr: INFO
    org.hibernate.SQL: WARN

crypto:
  secret-key: ${SECRET_KEY:}
